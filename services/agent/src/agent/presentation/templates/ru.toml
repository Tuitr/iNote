# Тексты агента для пользователя (CLAUDE.md: «тексты — в шаблонах, не в коде»).
# Подстановки — {имя}; названия записей агент экранирует под markdown до подстановки.
# Ключи проверяются при старте (лишний или пропущенный ключ — агент не стартует).

# Даты и время («Завтра, чт 22 октября, 10:00») — общие с ботом: libs/common/ru_dates.py

[created]
task = "Задача создана"
reminder = "Напоминание создано"
event = "Встреча создана"

[changed]
updated = "Изменено"
completed = "Отмечено выполненным"
# и удаление словами, и кнопка «Отменить» — запись больше не действует
deleted = "Отменено"
conflict = "На это время уже есть:"
free_slots = "Свободно: {slots}"
no_date = "без срока"
# изменено только напоминание встречи («напомни за 40 минут»): видно, когда напомню
remind_before = "Напомню за {offset}"
# формы для 1, 2–4, 5+: «за 1 минуту», «за 2 часа», «за 5 дней»; ровно 1 час или день — без числа
minutes = ["минуту", "минуты", "минут"]
hours = ["час", "часа", "часов"]
days = ["день", "дня", "дней"]

[list]
day_header = "{day}:"
week_header = "Неделя, {range}:"
range_header = "{first} — {last}:"
day_empty = "{day}: ничего не запланировано."
week_empty = "Неделя, {range}: ничего не запланировано."
range_empty = "{first} — {last}: ничего не запланировано."
all_day = "весь день"
# строка записи: «10:00–11:00 Созвон» / «весь день Купить хлеб»
line = "{when} {title}"
# в списке за неделю у каждой записи — день
line_with_day = "{day}, {when} {title}"
more = "…и ещё {count}"

[search]
found = "Нашёл:"
similar = "Нашёл несколько похожих — какую имеешь в виду?"
empty = "Ничего не нашёл. Попробуй сказать по-другому."
line = "{when} — {title}"
# выполненная запись в поиске: «что было про медведя» — видно, что уже сделано
done = "{line} (✓ выполнено)"

[answer]
fallback = "Готово."
# первая строка ответа на голосовое; текст экранирован под markdown
recognized = "Распознал: «{text}»"
# уточнение без текста модели
clarify = "Уточни, пожалуйста."
busy = "Ещё обрабатываю предыдущее сообщение — подожди пару секунд и напиши снова."

[buttons]
undo = "Отменить"
reschedule = "Изменить время"
open_item = "В календаре"
open_day = "Открыть день"
open_week = "Открыть неделю"
today = "Сегодня"
tomorrow = "Завтра"
week = "Неделя"
cancel = "Отмена"
# пересечение встреч — создать вопреки (confirm_conflict, allow_conflict у D)
force_create = "Всё равно создать"
# перенос поверх другой встречи (confirm_conflict с item_id)
force_move = "Всё равно перенести"

# ответы действий без LLM (/v1/actions)
[notices]
pending_expired = "Вопрос устарел — повтори просьбу."
cancelled = "Хорошо, отменил."
# второй «Отменить» по той же записи — не ошибка
already_undone = "Уже отменено."
already_completed = "Уже отмечено выполненным."
unknown_action = "Не понял кнопку — напиши, что сделать, словами."
# дневной лимит ходов с LLM (AGENT_LLM_DAILY_LIMIT); кнопки и мини-приложение работают
llm_daily_limit = "На сегодня лимит запросов исчерпан — продолжим завтра. Кнопки и мини-приложение работают."

# кнопка «Изменить время» без нового времени
[reschedule]
question = "На когда перенести? Выбери вариант или напиши, например: «завтра в 15»."
in_hour = "Через час"
same_time_tomorrow = "Завтра в {time}"
tomorrow_morning = "Завтра в {time}"

# «Отложить на 1 ч» и «Завтра» в напоминании
[snooze]
done = "Напомню: {when}"

# /settings: часовой пояс (S3)
[settings]
header = "Настройки"
tz = "Пояс: {tz}"
hint = "Пояс — кнопкой ниже: от него считаются «сегодня» и время напоминаний."
current = "✓ {city}"

# «Начать», /start и /help
[welcome]
start = """Привет! Я помогу с задачами, напоминаниями и встречами — пиши или говори голосом.
Например: «напомни завтра в 10 позвонить Ивану», «встреча с Петром завтра в 15», «что у меня завтра»."""
help = """Пиши обычным текстом или голосом:
• «напомни завтра в 10 позвонить Ивану»
• «создай задачу купить хлеб»
• «встреча с Петром завтра в 15»
• «что у меня завтра», «найди договор»
Команды: /today — сегодня, /tomorrow — завтра, /week — неделя, /settings — часовой пояс."""
open_today = "Мой день"
open_history = "История"

[errors]
default = "Не получилось выполнить запрос."
internal = "Что-то пошло не так. Попробуй ещё раз."
upstream_timeout = "Сервис записей не ответил вовремя. Попробуй ещё раз через минуту."
upstream_unavailable = "Сервис записей сейчас недоступен. Попробуй ещё раз через минуту."
validation_error = "Не разобрал время или данные. Скажи иначе, например: «завтра в 10»."
not_found = "Не нашёл такую запись."
past_time = "Это время уже прошло. Назови время в будущем."
conflict = "На это время уже что-то запланировано."
rate_limited = "Слишком много запросов. Подожди минуту и попробуй снова."
# сбой доступа между сервисами (неверный сервисный токен) — пользователь тут ни при чём
unauthorized = "Что-то пошло не так на нашей стороне. Попробуй ещё раз позже."
forbidden = "Что-то пошло не так на нашей стороне. Попробуй ещё раз позже."
stale = "Запись только что изменилась. Повтори просьбу."
llm_timeout = "Не успел понять запрос. Попробуй ещё раз."
llm_rate_limited = "Сейчас слишком много запросов. Попробуй через минуту."
llm_bad_output = "Не понял запрос. Попробуй сформулировать иначе."
llm_no_action = "Не получилось выполнить — ничего не сохранено. Попробуй сформулировать иначе."
