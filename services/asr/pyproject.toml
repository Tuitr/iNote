[project]
name = "va-asr"
version = "0.0.0"
description = "ASR: POST /v1/transcribe (J1) — голосовое OGG/Opus → текст, провайдер за SpeechToText"
requires-python = ">=3.12,<3.13"
dependencies = [
  "va-common",
  "va-contracts",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "redis>=5.2",
  "httpx>=0.28",
  "pydantic>=2.11",
  # multipart-форма J1 (audio, mime, lang)
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "asr"

[tool.uv.sources]
va-common = { workspace = true }
va-contracts = { workspace = true }
