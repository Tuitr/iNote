[project]
name = "va-bot"
version = "0.0.0"
description = "Бот MAX: апдейты, дедуп, лимиты, рендер Reply, доставка напоминаний"
requires-python = ">=3.12,<3.13"
dependencies = ["va-common", "va-contracts"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bot"

[tool.uv.sources]
va-common = { workspace = true }
va-contracts = { workspace = true }
