# Стенд разработки S0 (зона C, вместе с D). Запуск: `make up` (профиль mock).
#   mock — всё на фейках, без внешних ключей: фейковый MAX, заглушки чужих сервисов
#   full — пока совпадает с mock; после S1 сюда добавятся реальные ASR/LLM/MAX (платно, только по просьбе)
# Наружу (на 127.0.0.1) опубликованы бот — ради /dev/max/* в режиме fake — и api — ради
# `npm run dev` мини-приложения. /internal/* не публикуем.

name: va

x-profiles: &profiles
  profiles: [mock, full]

x-python-service: &python-service
  <<: *profiles
  env_file:
    - path: ../.env
      required: false
  restart: unless-stopped
  # uvicorn ждёт запросы до 15 с (python.Dockerfile) + задачи до 10 с + запас — tests/deploy/test_stop_budget.py
  stop_grace_period: 30s
  networks: [internal]
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status != 200)"
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

# --- зона D: один образ (Dockerfile в корне), сервисы отличаются командой ---
x-backend-d: &backend-d
  <<: *python-service
  build:
    context: ..
    dockerfile: Dockerfile
  image: va/backend-d:local

# --- конец зоны D ---
x-stub: &stub
  <<: *python-service
  build:
    context: stub
  image: va/stub:local
  restart: "no"

services:
  # --- инфраструктура ---
  postgres:
    <<: *profiles
    # Без pgvector: эмбеддер D убран, поиск — полнотекст и триграммы (pg_trgm есть в образе)
    image: postgres:16
    # Учётка — из .env (POSTGRES_*), её же содержит DATABASE_URL сервисов D
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-inote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *profiles
    image: redis:7.4-alpine
    # В Redis только то, что можно потерять (правило 4): без персистентности,
    # вытеснение только ключей с TTL — volatile-lru (docs/redis-keys.md)
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- зона C ---
  bot:
    <<: *python-service
    build:
      context: ..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: va-bot, MODULE: bot }
    image: va/bot:local
    environment:
      REDIS_URL: redis://redis:6379/0
      BOT_MAX_MODE: ${BOT_MAX_MODE:-fake}
      BOT_AGENT_URL: http://agent:8000
      BOT_ASR_URL: http://asr:8000
    ports:
      - "127.0.0.1:${BOT_DEV_PORT:-8001}:8000"
    depends_on:
      redis: { condition: service_healthy }
      agent: { condition: service_healthy }
      asr: { condition: service_healthy }

  agent:
    <<: *python-service
    build:
      context: ..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: va-agent, MODULE: agent }
    image: va/agent:local
    environment:
      REDIS_URL: redis://redis:6379/0
      # mock — ScriptedBrain; llm (Brain B) после мержа с libs/brain
      AGENT_BRAIN: ${AGENT_BRAIN:-scripted}
      AGENT_MCP_URL: http://mcp:8000/mcp
      AGENT_MCP_INTERNAL_URL: http://mcp:8000
    depends_on:
      redis: { condition: service_healthy }
      mcp: { condition: service_healthy }

  # --- заглушки чужих зон: одна мини-картинка deploy/stub; владелец — в STUB_OWNER ---
  asr:
    # ВРЕМЕННО (S2, C): ASR-заглушка по J1 из deploy/stub/asr («OggS» + текст → текст).
    # После мержа заменить на ASR_MODE=fake от A, затем на build: services/asr (владелец A)
    <<: *python-service
    build:
      context: stub/asr
    image: va/stub-asr:local
    restart: "no"

  # --- зона D ---
  migrate:
    # Одноразово накатывает схему (alembic upgrade head) и выходит; mcp, api, scheduler ждут его
    <<: *backend-d
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  mcp:
    # 8 инструментов MCP (J3) на /mcp и служебный REST /internal/v1 (J8) для агента
    <<: *backend-d
    # access-лог uvicorn выключен: строку на запрос с trace_id пишет RequestLogMiddleware D
    command: ["uvicorn", "services.mcp.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  api:
    # REST /v1 для мини-приложения (J5), только чтение
    <<: *backend-d
    command: ["uvicorn", "services.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    # на 127.0.0.1 — для `npm run dev` мини-приложения; на стенде с HTTPS — только через Caddy
    ports:
      - "127.0.0.1:${API_DEV_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  scheduler:
    # Напоминания в бот (J4, SCHED_BOT_URL) и сдвиг повторяющихся записей; без веб-сервера
    <<: *backend-d
    command: ["python", "-m", "services.scheduler.main"]
    # HTTP нет: жив, если последний проход цикла (раз в SCHED_INTERVAL_SECONDS) был не дольше
    # 2 минут назад — Scheduler трогает /tmp/scheduler-heartbeat после каждого прохода.
    # Без healthcheck `up --wait` в Compose v2 на раннере CI падает («has no healthcheck»)
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/scheduler-heartbeat') > 120)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  # --- конец зоны D ---

  max_app:
    # Владелец E. После мержа заменить на build: max_app (статика за Caddy на стенде)
    <<: *stub
    environment: { STUB_NAME: max_app, STUB_OWNER: E }

networks:
  internal:

volumes:
  pgdata:
