# Локальный стенд блока D. Compose общий с ролью C: сервисы других ролей
# добавляются сюда же по договорённости.
x-backend-d: &backend-d
  build: .
  image: inote-d
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый контейнер: накатывает миграции и выходит, mcp и api стартуют после него.
  migrate:
    build: .
    image: inote-d
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    <<: *backend-d
    command: ["uvicorn", "services.mcp.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    healthcheck: &ready-check
      # В slim-образе нет curl, поэтому /health/ready проверяем стандартным Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *backend-d
    command: ["uvicorn", "services.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck: *ready-check

  # Цикл напоминаний (J4): без портов и веб-сервера, ходит в бота роли C.
  scheduler:
    <<: *backend-d
    command: ["python", "-m", "services.scheduler.main"]

volumes:
  postgres-data:
