[project]
name = "va-brain"
version = "0.0.0"
description = "Brain (зона B): LLM-клиент GigaChat, промпт и цикл инструментов по J2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "va-common",
  "va-contracts",
  # GigaChat — REST напрямую (OAuth-токен + chat/completions), без отдельного SDK
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brain"

[tool.uv.sources]
va-common = { workspace = true }
va-contracts = { workspace = true }
