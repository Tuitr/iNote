[project]
name = "inote-backend"
version = "0.1.0"
description = "Бэкенд роли D: libs/core, libs/contracts, сервисы mcp и api"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14,<3",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    # Тип vector и расстояния pgvector в SQLAlchemy (поиск по смыслу).
    "pgvector>=0.5,<1",
    "redis>=8.1,<9",
    "mcp>=2.3,<3",
    # База часовых поясов для zoneinfo: на Windows и в slim-образах системной базы может не быть.
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",
    # PostgreSQL с pgvector и Redis в Docker для тестов.
    "testcontainers>=4.15,<5",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["libs*", "services*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]
# Тексты и комментарии на русском: RUF001–003 считают кириллицу похожей на латиницу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
