# pre-commit: `make hooks` ставит хуки pre-commit и commit-msg.
# ruff, mypy и import-linter — локальные хуки через `uv run`: версии берутся из uv.lock,
# как в CI и у всех в команде, а не из отдельных rev.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock актуален
        entry: uv lock --check
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy libs services
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: границы слоёв (import-linter)
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: conventional-commit
        name: "сообщение коммита: type(scope): текст"
        language: pygrep
        entry: '\A(Merge |Revert |(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert)(\([a-z0-9-]+\))?!?: \S)'
        args: [--negate, --multiline]
        stages: [commit-msg]
