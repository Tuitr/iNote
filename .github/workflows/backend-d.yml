# Проверки бэкенда роли D: линтер, все тесты с настоящими PostgreSQL и Redis (testcontainers),
# покрытие libs/core не ниже 80%. Только зона D: чужие сервисы со своими workflow не задевает.
name: backend-d

on:
  pull_request:
    paths:
      - "libs/core/**"
      - "libs/contracts/**"
      - "services/api/**"
      - "services/mcp/**"
      - "services/scheduler/**"
      - "services/*.py"
      - "services/tests/**"
      - "migrations/**"
      - "contracts/**"
      - "conftest.py"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/backend-d.yml"
  push:
    branches: [main]
    paths:
      - "libs/core/**"
      - "libs/contracts/**"
      - "services/api/**"
      - "services/mcp/**"
      - "services/scheduler/**"
      - "services/*.py"
      - "services/tests/**"
      - "migrations/**"
      - "contracts/**"
      - "conftest.py"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/backend-d.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests and coverage of libs/core
        # Docker на раннерах ubuntu есть: testcontainers поднимет postgres:16 и redis:7-alpine.
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80
